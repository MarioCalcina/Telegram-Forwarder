name: Pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    name: Pruebas (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows es donde corre el bot; Ubuntu asegura que no dependa de Windows.
        os: [ubuntu-latest, windows-latest]
    env:
      # La consola del bot usa simbolos como ✓ y ⚠.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Instalar dependencias
        # --locked falla si uv.lock no coincide con pyproject.toml.
        run: uv sync --locked

      - name: Correr las pruebas
        run: uv run python -m unittest discover -s tests -v
